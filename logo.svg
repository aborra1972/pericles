<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="face" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#F4A900"/>
    </radialGradient>
    <radialGradient id="screen" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#505050"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#0f0f23" stroke="#FFD93D" stroke-width="4"/>

  <!-- Toga / body hint -->
  <path d="M120 320 Q200 350 280 320 Q300 340 290 380 L110 380 Q100 340 120 320Z" fill="#E8E8E8" stroke="#ccc" stroke-width="1.5"/>
  <path d="M155 320 Q200 335 245 320" fill="none" stroke="#ccc" stroke-width="1.5"/>

  <!-- Corinthian helmet - back -->
  <path d="M110 160 Q100 100 140 60 Q200 30 260 60 Q300 100 290 160 L280 180 Q200 190 120 180 Z" fill="url(#helmet)" stroke="#666" stroke-width="2"/>

  <!-- Helmet crest (mohawk style - because Pericles had swag) -->
  <path d="M170 55 Q200 10 230 55" fill="#CC3333" stroke="#991111" stroke-width="2"/>
  <path d="M165 65 Q200 25 235 65" fill="#CC3333" stroke="#991111" stroke-width="1.5"/>
  <path d="M175 48 Q200 15 225 48" fill="#DD4444" stroke="#CC3333" stroke-width="1"/>

  <!-- Helmet face opening (the round display!) -->
  <circle cx="200" cy="155" r="75" fill="url(#screen)" stroke="#444" stroke-width="3"/>

  <!-- Screen bezel ring -->
  <circle cx="200" cy="155" r="78" fill="none" stroke="#FFD93D" stroke-width="1.5" opacity="0.5"/>

  <!-- Pixel eyes - LED style -->
  <g filter="url(#glow)">
    <!-- Left eye -->
    <rect x="165" y="135" width="18" height="18" rx="2" fill="#00ff88"/>
    <rect x="168" y="138" width="4" height="4" fill="#aaffcc" opacity="0.8"/>
    <!-- Right eye -->
    <rect x="217" y="135" width="18" height="18" rx="2" fill="#00ff88"/>
    <rect x="220" y="138" width="4" height="4" fill="#aaffcc" opacity="0.8"/>
  </g>

  <!-- Smirk mouth (he knows something you don't) -->
  <path d="M178 175 Q200 190 228 172" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- One raised eyebrow (the cheeky one) -->
  <path d="M163 130 Q174 122 185 128" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M215 128 Q226 126 237 132" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- WiFi signal from helmet (because he's connected to the cloud) -->
  <g opacity="0.7" filter="url(#glow)">
    <path d="M185 45 Q200 30 215 45" fill="none" stroke="#00aaff" stroke-width="2" stroke-linecap="round"/>
    <path d="M178 37 Q200 18 222 37" fill="none" stroke="#00aaff" stroke-width="2" stroke-linecap="round"/>
    <path d="M170 29 Q200 6 230 29" fill="none" stroke="#00aaff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tiny toga pin / brooch -->
  <circle cx="200" cy="318" r="6" fill="#FFD93D" stroke="#C8960C" stroke-width="1.5"/>
  <circle cx="200" cy="318" r="2.5" fill="#C8960C"/>

  <!-- Speech bubble with attitude -->
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="100" height="40" rx="12" fill="white" stroke="#333" stroke-width="2"/>
    <polygon points="0,30 -10,40 5,28" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="-2" y="27" width="10" height="6" fill="white"/>
    <text x="50" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1a1a2e">I know stuff</text>
  </g>

  <!-- Subtitle -->
  <text x="200" y="395" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFD93D" opacity="0.7">ESP32-S3 AI ASSISTANT</text>
</svg>
