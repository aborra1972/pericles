<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Pericles Configurador</title>
  <style>
    :root { --bg:#0a0a1a; --panel:#12122a; --card:#1a1a38; --line:#39395e; --text:#f3f2ff; --muted:#b5b3cf; --accent:#9b72ff; --danger:#ff7474; --ok:#75e6ba; font:16px/1.45 system-ui,sans-serif; color:var(--text); background:var(--bg) }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; grid-template-columns:250px minmax(0,1fr) } button,input,select { font:inherit } button { cursor:pointer } button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid #68d8ff; outline-offset:3px }
    nav { padding:1.5rem 1rem; border-right:1px solid var(--line); background:#0d0d21 } nav h1 { font-size:1.25rem; margin:0 0 .15rem } nav p { margin:0 0 1.5rem; color:var(--muted); font-size:.85rem } nav button { width:100%; text-align:left; padding:.65rem .8rem; margin:.15rem 0; border:0; border-radius:.55rem; color:var(--muted); background:transparent } nav button[aria-current="page"], nav button:hover { color:var(--text); background:#29234b }
    main { min-height:0; display:flex; flex-direction:column } header { padding:1.25rem 2rem; border-bottom:1px solid var(--line) } header h2 { margin:0 } header p { margin:.2rem 0 0;color:var(--muted) } #content { overflow:auto; padding:1.5rem 2rem 6rem; flex:1 } .page { max-width:820px } .page[hidden] { display:none }.card { background:linear-gradient(145deg,var(--card),#151531); border:1px solid var(--line); border-radius:.8rem; padding:1.25rem; margin:0 0 1rem }.notice { border-left:4px solid var(--accent) }.unavailable { opacity:.75 }.unavailable strong { color:#ffd87b }
    h3 { margin:0 0 .35rem } .help { margin:0 0 1rem; color:var(--muted); font-size:.92rem } .field { display:grid; grid-template-columns:minmax(12rem,1fr) minmax(12rem,20rem); gap:1rem; align-items:center; padding:.9rem 0; border-top:1px solid var(--line) }.field:first-of-type { border-top:0 }.field label { font-weight:600 }.field small { display:block; color:var(--muted); font-weight:400 }.control { width:100% } input[type="text"],select { border:1px solid var(--line); border-radius:.45rem; padding:.55rem; background:#0e0e25; color:var(--text) } input[type="range"] { accent-color:var(--accent) }.range { display:grid; grid-template-columns:1fr 4rem; gap:.5rem; align-items:center }.range output { text-align:right; color:#ddd4ff } .check { display:flex; gap:.6rem; align-items:center }.error { color:#ffaaaa; font-size:.85rem; margin:.25rem 0 0 }.chips { display:flex; flex-wrap:wrap; gap:.5rem }.chip { border:1px solid var(--accent); color:var(--text); background:#27204c; border-radius:999px; padding:.3rem .65rem }.chip[aria-pressed="true"] { background:var(--accent) }
    details { border-top:1px solid var(--line); padding-top:1rem; margin-top:1rem } summary { cursor:pointer; color:#ddd4ff }.skin-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.7rem }.skin { border:1px solid var(--line); background:#101027;color:var(--text);padding:1rem;border-radius:.6rem;text-align:left }.skin[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) }.backup { display:flex; gap:1rem; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding:.8rem 0 }.backup:first-child { border:0 }.btn { border:1px solid var(--line); border-radius:.45rem; background:#202044; color:var(--text); padding:.55rem .8rem }.btn.primary { background:var(--accent); border-color:var(--accent); color:#120e20 }.btn.danger { border-color:var(--danger); color:#ffd5d5 }.actions { position:fixed; bottom:0; right:0; left:250px; display:none; align-items:center; gap:.75rem; padding:.8rem 2rem; background:#15152d; border-top:1px solid var(--line) }.actions.visible { display:flex }.actions span { margin-right:auto; color:var(--muted) } .toast { position:fixed; bottom:5rem; right:1rem; background:#29234b; border:1px solid var(--accent); padding:.8rem 1rem; border-radius:.5rem }
    @media (max-width:700px) { body { grid-template-columns:1fr; grid-template-rows:auto 1fr } nav { display:flex; overflow:auto; gap:.2rem; padding:.7rem; border-right:0; border-bottom:1px solid var(--line) } nav h1,nav p { display:none } nav button { min-width:max-content; width:auto; margin:0 } header,#content { padding-left:1rem;padding-right:1rem }.actions { left:0;padding:.8rem 1rem }.field { grid-template-columns:1fr } }
  </style>
</head>
<body>
  <nav aria-label="Configuración"><div><h1>🎭 Pericles</h1><p>Configurador local</p></div>
    <button data-page="inicio">Inicio</button><button data-page="apariencia">Apariencia</button><button data-page="voz">Voz</button><button data-page="personalidad">Personalidad</button><button data-page="ia">IA</button><button data-page="privacidad">Privacidad</button><button data-page="backups">Backups</button><button data-page="dispositivo">Dispositivo</button>
  </nav>
  <main><header><h2 id="title"></h2><p id="subtitle"></p></header><div id="content"></div></main>
  <div class="actions" id="save-bar"><span>Cambios locales sin guardar</span><button class="btn" id="discard">Descartar</button><button class="btn" id="defaults">Restaurar valores predeterminados</button><button class="btn primary" id="save">Guardar cambios</button></div>
  <script type="module" src="dist/renderer.js"></script>
</body>
</html>
