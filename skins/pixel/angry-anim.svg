<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="round">
      <circle cx="120" cy="120" r="118"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="240" height="240" fill="#0f0f23"/>

    <!-- Face - red pulsing -->
    <circle cx="120" cy="120" r="100" fill="#FFD93D"/>
    <circle cx="120" cy="120" r="100" fill="#ff4444" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="100" fill="none" stroke="#E8A800" stroke-width="3"/>

    <!-- Left eye - squinting (animates between normal and angry) -->
    <g>
      <rect x="75" y="98" width="14" height="10" rx="2" fill="#00ff88">
        <animate attributeName="height" values="10;6;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="98;100;98" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="89" y="98" width="14" height="10" rx="2" fill="#00ff88">
        <animate attributeName="height" values="10;6;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="98;100;98" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Right eye - squinting -->
    <g>
      <rect x="137" y="98" width="14" height="10" rx="2" fill="#00ff88">
        <animate attributeName="height" values="10;6;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="98;100;98" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="151" y="98" width="14" height="10" rx="2" fill="#00ff88">
        <animate attributeName="height" values="10;6;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="98;100;98" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Angry V eyebrows (getting more intense) -->
    <path d="M68 88 L108 80" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-width" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M172 88 L132 80" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-width" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Frown (tightening) -->
    <path d="M90 150 Q120 135 150 150" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M90 150 Q120 135 150 150;M92 150 Q120 132 148 150;M90 150 Q120 135 150 150" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Steam lines (animated rising) -->
    <g stroke="#FF6B35" stroke-width="2" stroke-linecap="round">
      <line x1="50" y1="55" x2="40" y2="40" opacity="0.6">
        <animate attributeName="y1" values="55;45;55" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="40;28;40" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="55" y1="65" x2="48" y2="52" opacity="0.5">
        <animate attributeName="y1" values="65;52;65" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="y2" values="52;38;52" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
      </line>
      <line x1="185" y1="65" x2="192" y2="52" opacity="0.5">
        <animate attributeName="y1" values="65;52;65" dur="1.1s" repeatCount="indefinite" begin="0.1s"/>
        <animate attributeName="y2" values="52;38;52" dur="1.1s" repeatCount="indefinite" begin="0.1s"/>
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.1s" repeatCount="indefinite" begin="0.1s"/>
      </line>
      <line x1="190" y1="55" x2="200" y2="40" opacity="0.6">
        <animate attributeName="y1" values="55;45;55" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="y2" values="40;28;40" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
      </line>
    </g>

    <!-- Red cheeks (pulsing) -->
    <circle cx="65" cy="125" r="12" fill="#ff4444" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="175" cy="125" r="12" fill="#ff4444" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="1s" repeatCount="indefinite"/>
    </circle>

    <text x="120" y="220" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ff6b35" opacity="0.8">ANGRY</text>
  <g id="blink-eyelids" data-blink="single"><ellipse cx="89" cy="103" rx="20" ry="0" fill="#F2B843"><animate attributeName="ry" values="0;0;10;10;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" repeatCount="indefinite"/></ellipse><path d="M78.2 103 Q89 105 99.8 103" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" repeatCount="indefinite"/></path><ellipse cx="151" cy="103" rx="20" ry="0" fill="#F2B843"><animate attributeName="ry" values="0;0;10;10;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" begin=".025s" repeatCount="indefinite"/></ellipse><path d="M140.2 103 Q151 105 161.8 103" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" begin=".025s" repeatCount="indefinite"/></path></g></g>
</svg>
