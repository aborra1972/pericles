<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="round">
      <circle cx="120" cy="120" r="118"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="240" height="240" fill="#0f0f23"/>

    <!-- Face circle -->
    <circle cx="120" cy="120" r="100" fill="#FFD93D"/>
    <circle cx="120" cy="120" r="100" fill="none" stroke="#E8A800" stroke-width="3"/>

    <!-- Pixel grid overlay (subtle) -->
    <g opacity="0.05">
      <line x1="40" y1="0" x2="40" y2="240" stroke="#000" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="240" stroke="#000" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="240" stroke="#000" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="240" stroke="#000" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="240" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="40" x2="240" y2="40" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="80" x2="240" y2="80" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="120" x2="240" y2="120" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="160" x2="240" y2="160" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="200" x2="240" y2="200" stroke="#000" stroke-width="1"/>
    </g>

    <!-- Eyes - big happy pixel eyes -->
    <!-- Left eye -->
    <rect x="75" y="90" width="14" height="14" rx="2" fill="#00ff88"/>
    <rect x="89" y="90" width="14" height="14" rx="2" fill="#00ff88"/>
    <rect x="75" y="104" width="14" height="14" rx="2" fill="#00ff88"/>
    <rect x="89" y="104" width="14" height="14" rx="2" fill="#00ff88"/>
    <!-- Left eye highlight -->
    <rect x="77" y="92" width="5" height="5" fill="#aaffcc" opacity="0.8"/>

    <!-- Right eye -->
    <rect x="137" y="90" width="14" height="14" rx="2" fill="#00ff88"/>
    <rect x="151" y="90" width="14" height="14" rx="2" fill="#00ff88"/>
    <rect x="137" y="104" width="14" height="14" rx="2" fill="#00ff88"/>
    <rect x="151" y="104" width="14" height="14" rx="2" fill="#00ff88"/>
    <!-- Right eye highlight -->
    <rect x="139" y="92" width="5" height="5" fill="#aaffcc" opacity="0.8"/>

    <!-- Big smile -->
    <path d="M85 140 Q120 170 155 140" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <circle cx="65" cy="130" r="10" fill="#FF8C69" opacity="0.4"/>
    <circle cx="175" cy="130" r="10" fill="#FF8C69" opacity="0.4"/>

    <!-- Mood label -->
    <text x="120" y="220" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00ff88" opacity="0.8">HAPPY</text>
  <g id="blink-eyelids" data-blink="single"><ellipse cx="89" cy="104" rx="20" ry="0" fill="#FFD93D"><animate attributeName="ry" values="0;0;20;20;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" repeatCount="indefinite"/></ellipse><path d="M78.2 104 Q89 106 99.8 104" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" repeatCount="indefinite"/></path><ellipse cx="151" cy="104" rx="20" ry="0" fill="#FFD93D"><animate attributeName="ry" values="0;0;20;20;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" begin=".025s" repeatCount="indefinite"/></ellipse><path d="M140.2 104 Q151 106 161.8 104" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" begin=".025s" repeatCount="indefinite"/></path></g></g>
</svg>
