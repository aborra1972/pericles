<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="round">
      <circle cx="120" cy="120" r="118"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="240" height="240" fill="#0f0f23"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,0;0,-.5;0,0" dur="4.8s" repeatCount="indefinite"/>

      <circle cx="120" cy="120" r="100" fill="#FFD93D"/>
      <circle cx="120" cy="120" r="100" fill="none" stroke="#E8A800" stroke-width="3"/>

      <g fill="#00ff88">
        <rect x="75" y="90" width="14" height="14" rx="2"/>
        <rect x="89" y="90" width="14" height="14" rx="2"/>
        <rect x="75" y="104" width="14" height="14" rx="2"/>
        <rect x="89" y="104" width="14" height="14" rx="2"/>
        <rect x="137" y="90" width="14" height="14" rx="2"/>
        <rect x="151" y="90" width="14" height="14" rx="2"/>
        <rect x="137" y="104" width="14" height="14" rx="2"/>
        <rect x="151" y="104" width="14" height="14" rx="2"/>
      </g>
      <rect x="77" y="92" width="5" height="5" fill="#aaffcc" opacity=".8"/>
      <rect x="139" y="92" width="5" height="5" fill="#aaffcc" opacity=".8"/>

      <path d="M96 146 Q120 154 144 146" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>

      <g id="blink-eyelids" data-blink="single">
        <ellipse cx="89" cy="104" rx="20" ry="0" fill="#FFD93D">
          <animate attributeName="ry" values="0;0;20;20;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" repeatCount="indefinite"/>
        </ellipse>
        <path d="M78.2 104 Q89 106 99.8 104" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" repeatCount="indefinite"/>
        </path>
        <ellipse cx="151" cy="104" rx="20" ry="0" fill="#FFD93D">
          <animate attributeName="ry" values="0;0;20;20;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" begin=".025s" repeatCount="indefinite"/>
        </ellipse>
        <path d="M140.2 104 Q151 106 161.8 104" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.94;.96;.975;.995;1" dur="5.2s" begin=".025s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <text x="120" y="220" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00ff88" opacity=".8">IDLE</text>
  </g>
</svg>
