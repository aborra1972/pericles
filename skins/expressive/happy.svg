<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="round"><circle cx="120" cy="120" r="118"/></clipPath>
    <radialGradient id="faceGrad" cx="42%" cy="38%">
      <stop offset="0%" stop-color="#FFE87A"/>
      <stop offset="65%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FF7E7E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF7E7E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#1A7A42"/>
    </radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="240" height="240" fill="#0a0a1a"/>

    <!-- === FACE GROUP (breathing + bounce) === -->
    <g>
      <!-- Anticipation: slight compress before bounce -->
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,1; 0,0; 0,-4; 0,-2; 0,-4; 0,0"
        dur="2.5s" repeatCount="indefinite"/>
      <!-- Squash & stretch on bounce -->
      <animateTransform attributeName="transform" type="scale"
        values="1,1; 1.01,0.99; 1,1; 0.98,1.03; 0.99,1.01; 0.98,1.03; 1,1"
        dur="2.5s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(120,120)">
        <animateTransform attributeName="transform" type="translate"
          values="120,120; 120,121; 120,120; 120,116; 120,118; 120,116; 120,120"
          dur="2.5s" repeatCount="indefinite"/>

        <!-- Face base -->
        <circle cx="0" cy="0" r="100" fill="url(#faceGrad)"/>
        <circle cx="0" cy="0" r="100" fill="none" stroke="#C49214" stroke-width="2.5"/>
        <!-- Face highlight -->
        <ellipse cx="-18" cy="-30" rx="42" ry="28" fill="white" opacity="0.07" transform="translate(120,120)"/>
      </g>

      <!-- === EYES (squinted happy shape) === -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,1; 0,0; 0,-4; 0,-2; 0,-4; 0,0"
          dur="2.5s" repeatCount="indefinite"/>

        <!-- Left eye - happy crescent -->
        <path d="M65,108 Q80,92 105,108" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
        <!-- Eye sparkle -->
        <circle cx="85" cy="100" r="3" fill="white" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
        </circle>

        <!-- Right eye - happy crescent -->
        <path d="M135,108 Q160,92 175,108" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
        <!-- Eye sparkle -->
        <circle cx="155" cy="100" r="3" fill="white" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
        </circle>
      </g>

      <!-- === EYEBROWS (raised, arched) === -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,1; 0,0; 0,-4; 0,-2; 0,-4; 0,0"
          dur="2.5s" repeatCount="indefinite"/>
        <!-- Left brow - raised arch -->
        <path d="M58,75 Q80,60 108,72" fill="none" stroke="#7A5C12" stroke-width="5" stroke-linecap="round"/>
        <!-- Right brow - raised arch -->
        <path d="M132,72 Q160,60 182,75" fill="none" stroke="#7A5C12" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- === MOUTH (big smile) === -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,1; 0,0; 0,-4; 0,-2; 0,-4; 0,0"
          dur="2.5s" repeatCount="indefinite"/>
        <!-- Smile curve -->
        <path d="M80,140 Q120,172 160,140" fill="none" stroke="#8B4513" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Lip highlight -->
        <path d="M88,144 Q120,166 152,144" fill="none" stroke="#D4A017" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
      </g>

      <!-- === CHEEKS (pulsing glow) === -->
      <circle cx="55" cy="128" r="16" fill="url(#cheekGrad)">
        <animate attributeName="r" values="16;19;16" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.8;0.55" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="185" cy="128" r="16" fill="url(#cheekGrad)">
        <animate attributeName="r" values="16;19;16" dur="2.5s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="opacity" values="0.55;0.8;0.55" dur="2.5s" repeatCount="indefinite" begin="0.2s"/>
      </circle>

      <!-- === SPARKLE PARTICLES (secondary action) === -->
      <!-- Sparkle 1 - top right -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0.6;0;0" dur="2.5s" repeatCount="indefinite" begin="0.1s"/>
        <animateTransform attributeName="transform" type="translate" values="175,55; 180,48; 185,42" dur="2.5s" repeatCount="indefinite" begin="0.1s"/>
        <polygon points="0,-6 1.5,-2 6,0 1.5,2 0,6 -1.5,2 -6,0 -1.5,-2" fill="#FFE87A"/>
      </g>
      <!-- Sparkle 2 - top left -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.8;0.4;0;0" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
        <animateTransform attributeName="transform" type="translate" values="55,50; 50,44; 46,38" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
        <polygon points="0,-5 1.2,-1.8 5,0 1.2,1.8 0,5 -1.2,1.8 -5,0 -1.2,-1.8" fill="#FFE87A"/>
      </g>
      <!-- Sparkle 3 - right -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0.5;1;0.5;0;0" dur="2.5s" repeatCount="indefinite" begin="1.1s"/>
        <animateTransform attributeName="transform" type="translate" values="195,85; 200,78; 204,72" dur="2.5s" repeatCount="indefinite" begin="1.1s"/>
        <polygon points="0,-4 1,-1.5 4,0 1,1.5 0,4 -1,1.5 -4,0 -1,-1.5" fill="#FFD93D"/>
      </g>
    </g>
  </g>
</svg>